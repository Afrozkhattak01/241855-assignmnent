<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages - ConnecFriend</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="cf-nav"></div>

  <main class="cf-main">
    <div class="container-xxl px-3 px-lg-4">
      <div id="cf-header"></div>

      <div class="card rounded-4 overflow-hidden">
        <div class="row g-0">

          <div class="col-md-4 border-end">
            <div class="p-3 border-bottom d-flex align-items-center justify-content-between">
              <h2 class="h6 fw-bold mb-0">Private messages</h2>
              <button class="btn btn-sm btn-primary rounded-pill" onclick="openNewMessage()"><i class="bi bi-pencil-square me-1"></i>New</button>
            </div>
            <div class="list-group list-group-flush overflow-auto cf-chat-list" id="chatList"></div>
          </div>

          <div class="col-md-8">
            <div id="noChat" class="d-flex flex-column align-items-center justify-content-center text-center p-5 text-body-secondary cf-chat-empty">
              <i class="bi bi-chat-heart fs-1 mb-3 text-primary"></i>
              <h2 class="h5 fw-bold text-body">Your private messages</h2>
              <p class="small mb-3">Pick a chat, or start a new one with any member. They don't have to be your friend.</p>
              <button class="btn btn-primary rounded-pill" onclick="openNewMessage()">Start a chat</button>
            </div>

            <div id="chatBox" class="d-none">
              <div class="d-flex align-items-center gap-3 p-3 border-bottom" id="chatHeader"></div>
              <div class="overflow-auto p-3 bg-body-tertiary cf-chat-body" id="chatMessages"></div>
              <div class="p-3 border-top">
                <div class="d-flex gap-2 align-items-end">
                  <textarea id="messageText" class="form-control rounded-4" rows="1" placeholder="Write a private message..." onkeydown="enterToSend(event)"></textarea>
                  <button class="btn btn-primary rounded-circle" onclick="sendMessage()" title="Send"><i class="bi bi-send-fill"></i></button>
                </div>
                <div class="small text-danger mt-1" id="messageError"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="newMessageModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4">
        <div class="modal-header border-0 pb-0">
          <h2 class="modal-title h5 fw-bold">New private message</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="small text-body-secondary">You can message your friends and any other member.</p>
          <label for="sendTo" class="form-label fw-semibold">To</label>
          <select id="sendTo" class="form-select rounded-pill mb-1"></select>
          <div class="small text-danger mb-3" id="sendToError"></div>

          <label for="newMessageText" class="form-label fw-semibold">Message</label>
          <textarea id="newMessageText" class="form-control rounded-4" rows="3" placeholder="Say hello..."></textarea>
          <div class="small text-danger mt-1" id="newMessageError"></div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary rounded-pill px-4" onclick="sendNewMessage()"><i class="bi bi-send me-1"></i>Send</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="sentModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content rounded-4 text-center p-4">
        <span class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success-subtle text-success mx-auto mb-3 cf-avatar-lg">
          <i class="bi bi-check-lg fs-2"></i>
        </span>
        <h2 class="h5 fw-bold mb-1">Message sent</h2>
        <p class="text-body-secondary small mb-4" id="sentText"></p>
        <button type="button" class="btn btn-primary rounded-pill w-100" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
