<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile - ConnecFriend</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="cf-nav"></div>

  <main class="cf-main">
    <div class="container-xxl px-3 px-lg-4">
      <div id="cf-header"></div>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card rounded-4 overflow-hidden mb-4">
            <div class="cf-cover"></div>
            <div class="card-body px-4 pb-4 pt-0 text-center">
              <div class="cf-pull-up position-relative d-inline-block">
                <div id="profilePic" class="d-inline-flex"></div>
                <label for="photoInput" class="btn btn-primary btn-sm rounded-circle position-absolute bottom-0 end-0" title="Change profile picture">
                  <i class="bi bi-camera-fill"></i>
                </label>
                <input type="file" id="photoInput" class="d-none" accept="image/*" onchange="changePhoto()">
              </div>
              <div id="photoError" class="alert alert-danger small py-2 mt-3 mb-0 d-none"></div>
              <h2 class="h4 fw-bold mt-3 mb-0" id="profileName"></h2>
              <p class="text-body-secondary mb-2" id="profileUsername"></p>
              <p class="mb-3" id="profileBio"></p>

              <div class="row g-2">
                <div class="col-4">
                  <div class="bg-body-tertiary rounded-4 py-2">
                    <div class="fw-bold fs-5" id="friendCount">0</div>
                    <div class="small text-body-secondary">Friends</div>
                  </div>
                </div>
                <div class="col-4">
                  <div class="bg-body-tertiary rounded-4 py-2">
                    <div class="fw-bold fs-5" id="ratedCount">0</div>
                    <div class="small text-body-secondary">Rated</div>
                  </div>
                </div>
                <div class="col-4">
                  <div class="bg-body-tertiary rounded-4 py-2">
                    <div class="fw-bold fs-5" id="trustedCount">0</div>
                    <div class="small text-body-secondary">Trusted</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="card rounded-4">
            <div class="card-body p-4">
              <h2 class="h6 fw-bold mb-3">Personal information</h2>
              <div class="d-grid gap-3" id="infoList"></div>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card rounded-4">
            <div class="card-body p-4">
              <h2 class="h5 fw-bold mb-0">My friends</h2>
              <p class="small text-body-secondary mb-3">Rate each friend: Stupid, Cool or Trustworthy</p>
              <div class="row row-cols-1 row-cols-md-2 g-3" id="friendsList"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
