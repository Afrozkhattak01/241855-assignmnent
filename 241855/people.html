<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>People - ConnecFriend</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="cf-nav"></div>

  <main class="cf-main">
    <div class="container-xxl px-3 px-lg-4">
      <div id="cf-header"></div>

      <div class="card rounded-4 mb-4">
        <div class="card-body p-4">
          <h2 class="h5 fw-bold mb-3">Requests for you <span class="badge rounded-pill bg-warning" id="requestCount"></span></h2>
          <div class="row row-cols-1 row-cols-md-2 g-3" id="requestList"></div>
        </div>
      </div>

      <div class="card rounded-4">
        <div class="card-body p-4">
          <h2 class="h5 fw-bold mb-0">Find people</h2>
          <p class="small text-body-secondary mb-3">Invite members to become friends so you can share updates.</p>
          <div class="alert alert-secondary small rounded-4">
            <i class="bi bi-info-circle text-primary me-1"></i>
            If a member has put you on their ignore list, a friend request can't be sent to them.
          </div>
          <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3" id="peopleList"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/people.js"></script>
</body>
</html>
